name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Build, test, and verify parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Verify parity against upstream lucide
        run: node scripts/verify-parity.mjs
